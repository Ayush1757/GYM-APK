<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Sign In - Gym App</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="responsive.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #080000;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 50px 40px;
            background-color: #0d0202;
            border-radius: 40px;
            border: 1px solid #1a0505;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .avatar-circle {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            border: 2px solid #ff0000;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 25px;
            background-color: #000;
        }

        .avatar-circle svg {
            width: 45px;
            height: 45px;
            fill: #111;
            stroke: #000;
            stroke-width: 1;
        }

        h2 {
            color: #ffffff;
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 35px;
            letter-spacing: 0.5px;
        }

        form {
            width: 100%;
        }

        .input-field {
            width: 100%;
            padding: 18px 20px;
            margin-bottom: 12px;
            border: none;
            border-radius: 12px;
            background-color: #e9efff;
            color: #000;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
        }

        .input-field::placeholder {
            color: #666;
        }

        .role-label {
            color: #8d8d8d;
            font-size: 16px;
            margin: 15px 0 10px;
            display: block;
        }

        .role-select {
            width: 100%;
            padding: 15px 20px;
            background-color: #0f0f0f;
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            margin-bottom: 25px;
            appearance: none;
            cursor: pointer;
            text-align: center;
            outline: none;
        }

        .login-btn {
            background-color: #ffffff;
            color: #000000;
            padding: 5px 15px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: normal;
            cursor: pointer;
            margin-bottom: 20px;
            transition: 0.2s;
        }

        .login-btn:hover {
            opacity: 0.9;
        }

        .footer {
            color: #ffffff;
            font-size: 16px;
            font-weight: 500;
        }

        .footer a {
            color: #7e57c2;
            text-decoration: none;
            margin-left: 5px;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        /* Mobile specific adjustments */
        @media (max-width: 480px) {
            .login-container {
                padding: 40px 25px;
                border-radius: 30px;
            }
            
            h2 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

    <div class="login-container">
        <div class="avatar-circle">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 11c1.1 0 2 .9 2 2s-.9 2-2 2-2-.9-2-2 .9-2 2-2zm6-3.2c0-3.2-2.7-5.8-6-5.8s-6 2.6-6 5.8V10H5v11h14V10h-1V7.8zM12 4.2c2.1 0 3.8 1.6 3.8 3.6V10H8.2V7.8c0-2 1.7-3.6 3.8-3.6zM17 19H7v-7h10v7z"/>
            </svg>
        </div>

        <h2>Sign In</h2>

        <form id="loginForm">
            <input type="email" name="email" id="loginEmail" class="input-field" placeholder="Email" required>
            <input type="password" name="password" id="loginPassword" class="input-field" placeholder="Password" required>

            <label class="role-label">Login as</label>
            <select name="role" id="loginRole" class="role-select" required>
                <option value="user" selected>Member</option>
                <option value="admin">Administrator</option>
            </select>

            <button type="submit" id="loginBtn" class="login-btn">Login</button>
        </form>

        <div class="footer">
            Don't have an account? <a href="/register.html">Register</a>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            const originalText = btn.innerText;
            btn.innerText = '...';
            btn.disabled = true;

            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const role = document.getElementById('loginRole').value;

            try {
                const response = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password, role })
                });

                const result = await response.json();
                if (result.success) {
                    localStorage.setItem("user", JSON.stringify(result.user));
                    window.location.href = result.redirect;
                } else {
                    alert(result.message || 'Login failed');
                    btn.innerText = originalText;
                    btn.disabled = false;
                }
            } catch (err) {
                console.error(err);
                alert('Login Error. Please try again.');
                btn.innerText = originalText;
                btn.disabled = false;
            }
        });
    </script>

</body>

</html>
