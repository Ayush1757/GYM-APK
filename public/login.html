<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(-45deg, #050505, #1a0000, #330000, #000000);
            background-size: 400% 400%;
            animation: gradientMove 10s ease infinite;
            overflow: hidden;
        }

        /* Animated Background */
        @keyframes gradientMove {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        /* Glass Card */
        .login-container {
            width: 380px;
            padding: 40px;
            border-radius: 24px;
            backdrop-filter: blur(20px);
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 26, 26, 0.2);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7), 0 0 15px rgba(255, 26, 26, 0.1);
            text-align: center;
            color: white;
        }

        /* Avatar */
        .avatar {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            margin-bottom: 25px;
            border: 3px solid #ff1a1a;
            box-shadow: 0 0 20px rgba(255, 26, 26, 0.5);
            background: #111;
            padding: 10px;
        }

        /* Input Fields */
        input,
        select {
            width: 100%;
            padding: 14px;
            margin: 12px 0;
            border: 1px solid rgba(255, 255, 255, 0.1);
            outline: none;
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.4);
            color: white;
            transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        input:focus,
        select:focus {
            background: rgba(255, 26, 26, 0.1);
            border-color: #ff1a1a;
            box-shadow: 0 0 15px rgba(255, 26, 26, 0.3);
        }

        /* Button */
        button {
            width: 100%;
            padding: 14px;
            margin-top: 20px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #ff1a1a 0%, #cc0000 100%);
            color: white;
            font-weight: 700;
            font-size: 16px;
            letter-spacing: 1px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(255, 26, 26, 0.4);
        }

        button:hover {
            background: linear-gradient(135deg, #ff3333 0%, #e60000 100%);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 26, 26, 0.6);
        }

        /* Footer */
        .footer {
            margin-top: 25px;
            font-size: 14px;
            color: #9ca3af;
        }

        .footer a {
            color: #ff1a1a;
            text-decoration: none;
            font-weight: 600;
            margin-left: 5px;
        }

        .footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="login-container">
        <img src="https://cdn-icons-png.flaticon.com/512/3064/3064197.png" class="avatar">
        <h2>Sign In</h2>

        <form id="loginForm">
            <input type="email" name="email" id="loginEmail" placeholder="Email" required>
            <input type="password" name="password" id="loginPassword" placeholder="Password" required>

            <label>Login as</label>
            <select name="role" id="loginRole" required>
                <option value="user" selected>Member</option>
                <option value="admin">Administrator</option>
            </select>

            <button type="submit" id="loginBtn">Login</button>
        </form>

        <div class="footer">
            Don't have an account?
            <a href="/register.html">Register</a>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            const originalText = btn.innerText;
            btn.innerText = 'Signing in...';
            btn.disabled = true;

            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const role = document.getElementById('loginRole').value;

            try {
                const response = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password, role })
                });

                const result = await response.json();
                if (result.success) {
                    localStorage.setItem("user", JSON.stringify(result.user));
                    window.location.href = result.redirect;
                } else {
                    alert(result.message || 'Login failed');
                    btn.innerText = originalText;
                    btn.disabled = false;
                }
            } catch (err) {
                console.error(err);
                alert('Login Error. Please try again.');
                btn.innerText = originalText;
                btn.disabled = false;
            }
        });
    </script>

</body>

</html>
