<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="stylesheet" href="responsive.css">
    <style>
        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(-45deg, #050505, #1a0000, #330000, #000000);
            background-size: 400% 400%;
            animation: gradientMove 10s ease infinite;
            padding: 20px;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .login-container {
            width: 100%;
            max-width: 400px;
            padding: 40px;
            border-radius: 24px;
            backdrop-filter: blur(20px);
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 26, 26, 0.2);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7);
            text-align: center;
        }

        .avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            margin-bottom: 20px;
            border: 2px solid var(--primary-red);
            padding: 5px;
            background: #111;
        }

        h2 { margin-bottom: 20px; font-weight: 700; }

        @media (max-width: 480px) {
            .login-container {
                padding: 30px 20px;
            }
        }
    </style>
</head>

<body>

    <div class="login-container">
        <img src="https://cdn-icons-png.flaticon.com/512/3064/3064197.png" class="avatar">
        <h2>Sign In</h2>

        <form id="loginForm">
            <input type="email" name="email" id="loginEmail" placeholder="Email" required>
            <input type="password" name="password" id="loginPassword" placeholder="Password" required>

            <label>Login as</label>
            <select name="role" id="loginRole" required>
                <option value="user" selected>Member</option>
                <option value="admin">Administrator</option>
            </select>

            <button type="submit" id="loginBtn">Login</button>
        </form>

        <div class="footer">
            Don't have an account?
            <a href="/register.html">Register</a>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            const originalText = btn.innerText;
            btn.innerText = 'Signing in...';
            btn.disabled = true;

            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const role = document.getElementById('loginRole').value;

            try {
                const response = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password, role })
                });

                const result = await response.json();
                if (result.success) {
                    localStorage.setItem("user", JSON.stringify(result.user));
                    window.location.href = result.redirect;
                } else {
                    alert(result.message || 'Login failed');
                    btn.innerText = originalText;
                    btn.disabled = false;
                }
            } catch (err) {
                console.error(err);
                alert('Login Error. Please try again.');
                btn.innerText = originalText;
                btn.disabled = false;
            }
        });
    </script>

</body>

</html>
