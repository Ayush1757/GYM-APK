<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Attendance QR</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background: linear-gradient(-45deg, #000000, #220000, #440000, #ff0000);
background-size:400% 400%;
animation: gradientMove 10s ease infinite;
color:white;
font-family:'Segoe UI', sans-serif;
}

@keyframes gradientMove{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

.card{
background: rgba(0,0,0,0.75);
padding:40px;
border-radius:25px;
text-align:center;
width:420px;
box-shadow:0 0 40px rgba(255,0,0,0.35);
}

h1{
color:#ff3333;
margin-bottom:20px;
}

#qrcode{
margin-top:20px;
display:flex;
justify-content:center;
}
</style>
</head>

<body>

<div class="card">
<h1>Your Attendance QR</h1>
<p>Show this QR to Gym Staff</p>
<div id="qrcode"></div>
</div>

<script>

const user = JSON.parse(localStorage.getItem("user"));

if(!user){
    alert("Please login first");
    window.location.href = "/login.html";
}

fetch("/getUserQR?email=" + encodeURIComponent(user.email))
.then(res => res.json())
.then(data => {
    const qrDiv = document.getElementById("qrcode");
    if (data.success && data.qrImage) {
        const img = document.createElement("img");
        img.src = data.qrImage;
        img.alt = "Your QR code";
        img.style.maxWidth = "220px";
        img.style.width = "100%";
        qrDiv.appendChild(img);
    } else {
        qrDiv.innerHTML = "<p style='color:#9ca3af;'>No QR assigned. Ask admin to upload your QR.</p>";
    }
});

</script>

</body>
</html>
