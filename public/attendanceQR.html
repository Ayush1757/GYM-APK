<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Attendance QR</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="responsive.css">
    <style>
        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(-45deg, #050505, #1a0000, #330000, #000000);
            background-size: 400% 400%;
            animation: gradientMove 10s ease infinite;
            padding: 20px;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            padding: 40px;
            border-radius: 25px;
            text-align: center;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), 0 0 20px rgba(255, 26, 26, 0.2);
            border: 1px solid rgba(255, 26, 26, 0.3);
        }

        h1 {
            color: #ff1a1a;
            margin-bottom: 20px;
            text-shadow: 0 0 10px rgba(255, 26, 26, 0.3);
            font-size: 24px;
        }

        #qrcode {
            margin-top: 20px;
            background: white;
            padding: 15px;
            border-radius: 12px;
            display: inline-block;
        }

        #qrcode img {
            max-width: 100%;
            height: auto;
        }

        @media (max-width: 480px) {
            .card { padding: 30px 20px; }
            h1 { font-size: 20px; }
        }
    </style>
</head>

<body>

    <div class="card">
        <div style="text-align: left; margin-bottom: 15px;">
            <button onclick="window.history.back()"
                style="background: none; border: 1px solid rgba(255,26,26,0.3); color: #ff1a1a; padding: 8px 15px; border-radius: 8px; cursor: pointer; font-size: 14px; transition: 0.3s;">
                <i class="fas fa-arrow-left"></i> Back
            </button>
        </div>
        <h1>Your Attendance QR</h1>
        <p style="color: #9ca3af; font-size: 14px;">Show this QR to Gym Staff for daily check-in</p>
        <div id="qrcode"></div>
        <div style="margin-top: 25px; font-size: 12px; color: #666;">
            This code is unique to your account.
        </div>
    </div>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>

        const user = JSON.parse(localStorage.getItem("user"));

        if (!user) {
            alert("Please login first");
            window.location.href = "/login.html";
        } else {
            // Generate QR code from email
            const qrcodeContainer = document.getElementById("qrcode");
            
            // Check if there's an admin-uploaded QR image first
            fetch("/getUserQR?email=" + encodeURIComponent(user.email))
                .then(res => res.json())
                .then(data => {
                    if (data.success && data.qrImage) {
                        // Show uploaded image
                        qrcodeContainer.innerHTML = `<img src="${data.qrImage}" style="width:220px; height:220px; border-radius:8px;">`;
                        qrcodeContainer.style.background = "none";
                        qrcodeContainer.style.padding = "0";
                    } else {
                        // Fallback: Generate QR from email
                        new QRCode(qrcodeContainer, {
                            text: user.email,
                            width: 220,
                            height: 220,
                            colorDark: "#000000",
                            colorLight: "#ffffff",
                            correctLevel: QRCode.CorrectLevel.H
                        });
                    }
                })
                .catch(err => {
                    console.error("Error fetching QR:", err);
                    // Fallback: Generate QR from email
                    new QRCode(qrcodeContainer, {
                        text: user.email,
                        width: 220,
                        height: 220
                    });
                });
        }

    </script>

</body>

</html>
