<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scan Gym QR</title>
<script src="https://unpkg.com/html5-qrcode"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: linear-gradient(-45deg, #050505, #1a0000, #330000, #4d0000);
    background-size: 400% 400%;
    animation: gradientMove 10s ease infinite;
    color: white;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    padding: 20px;
    box-sizing: border-box;
}
@keyframes gradientMove {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}
.card {
    background: rgba(10, 0, 0, 0.85);
    padding: 30px;
    border-radius: 20px;
    text-align: center;
    width: 100%;
    max-width: 450px;
    box-shadow: 0 0 30px rgba(255, 26, 26, 0.2);
    border: 1px solid #4d0000;
}
h1 {
    color: #ff1a1a;
    margin-top: 0;
    margin-bottom: 10px;
}
p {
    color: #d1d5db;
    margin-bottom: 20px;
    font-size: 14px;
}
#reader {
    width: 100%;
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 20px;
    border: 2px solid #ff1a1a;
    box-shadow: 0 0 15px rgba(255, 26, 26, 0.3);
    background: white;
}
.btn {
    background: linear-gradient(135deg, #ff1a1a, #cc0000);
    color: white;
    border: none;
    padding: 12px 24px;
    font-size: 16px;
    font-weight: bold;
    border-radius: 8px;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
    width: 100%;
}
.btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 5px 15px rgba(255, 26, 26, 0.4);
}
.btn-secondary {
    background: transparent;
    border: 1px solid #ff1a1a;
    margin-top: 15px;
}
.btn-secondary:hover {
    background: rgba(255, 26, 26, 0.1);
}
#result {
    margin-top: 20px;
    font-size: 18px;
    font-weight: bold;
    padding: 15px;
    border-radius: 8px;
    display: none;
}
.success {
    background: rgba(34, 197, 94, 0.1);
    color: #22c55e;
    border: 1px solid #22c55e;
}
.error {
    background: rgba(239, 68, 68, 0.1);
    color: #ef4444;
    border: 1px solid #ef4444;
}

/* Override html5-qrcode styles */
#reader button {
    background: #ff1a1a;
    color: white;
    border: none;
    padding: 8px 16px;
    border-radius: 6px;
    cursor: pointer;
    margin: 5px;
    font-weight: bold;
}
#reader select {
    padding: 8px;
    border-radius: 6px;
    margin-bottom: 10px;
    max-width: 100%;
}
#reader a {
    color: #ff1a1a;
}
</style>
</head>
<body>

<div class="card">
    <h1><i class="fas fa-expand"></i> Scan Gym QR</h1>
    <p>Point your camera at the QR code located at the gym entrance to check-in or check-out.</p>
    
    <div id="reader"></div>
    <div id="result"></div>
    
    <button class="btn btn-secondary" onclick="window.location.href='/home.html'">
        <i class="fas fa-arrow-left"></i> Back to Dashboard
    </button>
</div>

<script>
    const user = JSON.parse(localStorage.getItem("user"));
    if(!user){
        alert("Please login first");
        window.location.href = "/login.html";
    }

    const html5QrcodeScanner = new Html5QrcodeScanner(
        "reader", 
        { fps: 10, qrbox: {width: 250, height: 250} }, 
        false
    );

    let isProcessing = false;

    async function onScanSuccess(decodedText, decodedResult) {
        if (isProcessing) return;
        
        isProcessing = true;
        html5QrcodeScanner.pause();
        
        const resultDiv = document.getElementById("result");
        resultDiv.style.display = "block";
        resultDiv.className = "";
        resultDiv.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processing...';
        
        try {
            const res = await fetch("/scanGymQR", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    email: user.email,
                    token: decodedText
                })
            });
            const data = await res.json();
            
            if (data.success) {
                resultDiv.className = "success";
                let msg = data.action === "IN" 
                    ? "Check-IN successful! Enjoy your workout. 💪" 
                    : `Check-OUT successful! You worked out for ${data.workoutDuration} mins. 🔥`;
                resultDiv.innerHTML = `<i class="fas fa-check-circle"></i> ${msg}`;
            } else {
                resultDiv.className = "error";
                resultDiv.innerHTML = `<i class="fas fa-exclamation-triangle"></i> ${data.message}`;
            }
        } catch(e) {
            resultDiv.className = "error";
            resultDiv.innerHTML = '<i class="fas fa-times-circle"></i> Connection error. Please try again.';
        }
        
        setTimeout(() => {
            resultDiv.style.display = "none";
            isProcessing = false;
            html5QrcodeScanner.resume();
        }, 4000);
    }

    function onScanFailure(error) {
        // handle scan failure, usually better to ignore and keep scanning
    }

    html5QrcodeScanner.render(onScanSuccess, onScanFailure);
</script>

</body>
</html>
