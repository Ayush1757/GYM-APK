<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reset Password | Tara Fitness Centre</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #050505;
            font-family: 'Inter', sans-serif;
            color: white;
        }
        .container {
            width: 100%;
            max-width: 420px;
            padding: 40px;
            background: rgba(17,17,17,0.9);
            border-radius: 20px;
            border: 1px solid rgba(255,26,26,0.1);
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }
        h2 { margin-bottom: 10px; font-weight: 800; }
        p { color: #6b7280; font-size: 14px; margin-bottom: 25px; }
        .input-group { position: relative; margin-bottom: 20px; }
        .input-group i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: #4b5563; }
        .input-group input {
            width: 100%;
            padding: 15px 15px 15px 45px;
            background: #000;
            border: 1px solid #222;
            border-radius: 12px;
            color: white;
            outline: none;
            transition: 0.3s;
        }
        .input-group input:focus { border-color: #ff1a1a; }
        .btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #ff1a1a, #cc0000);
            border: none;
            border-radius: 12px;
            color: white;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(255,26,26,0.3); }
        .toast {
            position: fixed; top: 20px; right: 20px; padding: 12px 20px; border-radius: 8px;
            color: white; font-size: 14px; z-index: 1000;
        }
        .success { background: #10b981; }
        .error { background: #ef4444; }
    </style>
</head>
<body>
    <div id="toast" class="toast" style="display: none;"></div>
    <div class="container">
        <h2>Set New Password</h2>
        <p>Enter a secure password for your account.</p>
        <div id="resetForm">
            <div class="input-group">
                <i class="fas fa-lock"></i>
                <input type="password" id="newPassword" placeholder="New Password" required>
            </div>
            <div class="input-group">
                <i class="fas fa-check-circle"></i>
                <input type="password" id="confirmPassword" placeholder="Confirm Password" required>
            </div>
            <button onclick="handleReset()" class="btn" id="submitBtn">Update Password</button>
        </div>
        <div id="successMsg" style="display: none;">
            <div style="font-size: 50px; color: #10b981; margin-bottom: 20px;"><i class="fas fa-check-circle"></i></div>
            <p style="color: #fff; font-size: 16px;">Password updated successfully!</p>
            <a href="/login.html" class="btn" style="display: inline-block; text-decoration: none; margin-top: 20px;">Go to Login</a>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        const email = urlParams.get('email');

        function showToast(msg, type) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className = 'toast ' + type;
            t.style.display = 'block';
            setTimeout(() => t.style.display = 'none', 3000);
        }

        async function handleReset() {
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (newPassword.length < 6) return showToast('Password must be at least 6 characters', 'error');
            if (newPassword !== confirmPassword) return showToast('Passwords do not match', 'error');

            const btn = document.getElementById('submitBtn');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Updating...';
            btn.disabled = true;

            try {
                const res = await fetch('/api/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, token, newPassword })
                });
                const data = await res.json();
                if (data.success) {
                    document.getElementById('resetForm').style.display = 'none';
                    document.getElementById('successMsg').style.display = 'block';
                } else {
                    showToast(data.message, 'error');
                    btn.innerHTML = 'Update Password';
                    btn.disabled = false;
                }
            } catch (err) {
                showToast('Error updating password', 'error');
                btn.innerHTML = 'Update Password';
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
