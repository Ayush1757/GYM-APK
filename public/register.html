<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Register</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #050505;
            overflow: hidden;
        }

        .register-container {
            width: 360px;
            padding: 40px;
            border-radius: 12px;
            background: #111111;
            border: 1px solid #330000;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            text-align: center;
            color: white;
        }

        .logo {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            margin-bottom: 20px;
            object-fit: cover;
            border: 2px solid #ff1a1a;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #333;
            outline: none;
            border-radius: 8px;
            background: #0b0b0b;
            color: white;
            transition: 0.2s;
        }

        input:focus {
            border-color: #ff1a1a;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            border: none;
            border-radius: 8px;
            background: #ff1a1a;
            color: #ffffff;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: #cc0000;
        }

        .footer {
            margin-top: 15px;
            font-size: 14px;
            color: #ccc;
        }

        .footer a {
            color: #ff4d4d;
            text-decoration: none;
        }

        .admin-key-container {
            display: none;
            margin-top: 10px;
        }
    </style>
</head>

<body>

    <div class="register-container">

        <!-- Logo -->
        <img src="/logo.jpg" class="logo" alt="Tara Fitness Center Logo">

        <h2>Create Account</h2>

        <form action="/register" method="POST" id="regForm">

            <input type="text" name="fullname" placeholder="Full Name" required>

            <input type="email" name="email" placeholder="Enter Email" required>

            <input type="password" name="password" placeholder="Create Password" required>

            <input type="password" name="confirmPassword" placeholder="Confirm Password" required>

            <label>Register as</label>
            <select name="role" id="roleSelect" title="Register Role">
                <option value="user" selected>Member</option>
                <option value="admin">Administrator</option>
            </select>

            <div id="adminKeyContainer" class="admin-key-container">
                <label>Admin key</label>
                <input type="password" name="adminKey" placeholder="Secret code">
            </div>

            <button type="submit">Register</button>

        </form>

        <div class="footer">
            Already have an account? <a href="/login.html">Login</a>
        </div>

    </div>

    <script>
        // show/hide admin key input when role is changed
        (function () {
            const roleSelect = document.getElementById('roleSelect');
            const adminContainer = document.getElementById('adminKeyContainer');
            if (!roleSelect || !adminContainer) return;
            function update() {
                adminContainer.style.display = roleSelect.value === 'admin' ? 'block' : 'none';
            }
            roleSelect.addEventListener('change', update);
            update();
        })();

        // Handle Registration Form
        document.getElementById('regForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            const originalText = btn.innerText;
            btn.innerText = 'Registering...';
            btn.disabled = true;

            const formData = new FormData(this);
            const data = Object.fromEntries(formData.entries());

            try {
                const response = await fetch('/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const result = await response.json();
                if (result.success) {
                    if (result.user) {
                        localStorage.setItem("user", JSON.stringify(result.user));
                        alert(result.message || 'Registration successful!');
                        window.location.href = result.redirect || (result.user.role === 'admin' ? '/dashboard.html' : '/home.html');
                    } else {
                        alert('Registration successful! Please login.');
                        window.location.href = '/login.html';
                    }
                } else {
                    alert(result.message || 'Error during registration');
                    btn.innerText = originalText;
                    btn.disabled = false;
                }
            } catch (err) {
                console.error(err);
                alert('Registration Error occurred');
                btn.innerText = originalText;
                btn.disabled = false;
            }
        });
    </script>

</body>

</html>
